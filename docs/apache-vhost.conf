<VirtualHost *:80>
    ServerName two-prestashop.test
    Redirect permanent / https://two-prestashop.test/
</VirtualHost>

<VirtualHost *:443>
    ServerName two-prestashop.test
    DocumentRoot /var/www/two-prestashop
    SSLEngine on
    SSLCertificateFile /var/www/two-prestashop/dev-ssl/two-prestashop.test.pem
    SSLCertificateKeyFile /var/www/two-prestashop/dev-ssl/two-prestashop.test-key.pem
    <Directory /var/www/two-prestashop>
        AllowOverride All
        Require all granted
    </Directory>
    <FilesMatch "\.map$">
        Require all granted
    </FilesMatch>
</VirtualHost>
